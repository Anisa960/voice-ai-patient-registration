<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Registration Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #131a22;
    --border: #223040;
    --text: #e8eef4;
    --muted: #8fa3b3;
    --accent: #4fd1c5;
    --danger: #f56565;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  input, button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input { min-width: 200px; }
  button {
    cursor: pointer;
    background: var(--accent);
    color: #06201d;
    font-weight: 600;
    border: none;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  #status { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(255,255,255,0.02); }
  .empty {
    padding: 40px;
    text-align: center;
    color: var(--muted);
  }
  .error {
    color: var(--danger);
    padding: 12px;
    border: 1px solid var(--danger);
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .count-badge {
    display: inline-block;
    background: rgba(79, 209, 197, 0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    margin-left: 8px;
  }
</style>
</head>
<body>

  <h1>Patient Registration Dashboard <span class="count-badge" id="countBadge">0</span></h1>
  <div class="sub">Read-only view of patients registered via the voice AI agent.</div>

  <div class="toolbar">
    <input id="apiUrl" type="text" placeholder="API base URL" value="https://voice-ai-patient-registration-production-aeb0.up.railway.app">
    <input id="filterPhone" type="text" placeholder="Filter by phone number">
    <input id="filterLastName" type="text" placeholder="Filter by last name">
    <button onclick="loadPatients()">Search</button>
    <button class="secondary" onclick="clearFilters()">Clear</button>
  </div>

  <div id="status">Loading...</div>
  <div id="content"></div>

<script>
  function apiBase() {
    return document.getElementById('apiUrl').value.replace(/\/$/, '');
  }

  function clearFilters() {
    document.getElementById('filterPhone').value = '';
    document.getElementById('filterLastName').value = '';
    loadPatients();
  }

  function escapeHtml(str) {
    if (str === null || str === undefined || str === '') return '<span style="color:#4a5a68">—</span>';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatPhone(p) {
    if (!p || p.length !== 10) return escapeHtml(p);
    return `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`;
  }

  async function loadPatients() {
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const badge = document.getElementById('countBadge');
    statusEl.textContent = 'Loading...';
    contentEl.innerHTML = '';

    const params = new URLSearchParams();
    const phone = document.getElementById('filterPhone').value.trim();
    const lastName = document.getElementById('filterLastName').value.trim();
    if (phone) params.set('phone_number', phone);
    if (lastName) params.set('last_name', lastName);

    const url = `${apiBase()}/patients${params.toString() ? '?' + params.toString() : ''}`;

    try {
      const res = await fetch(url);
      const json = await res.json();

      if (json.error) {
        statusEl.textContent = '';
        contentEl.innerHTML = `<div class="error">API error: ${escapeHtml(JSON.stringify(json.error))}</div>`;
        badge.textContent = '0';
        return;
      }

      const patients = Array.isArray(json.data) ? json.data : (json.data ? [json.data] : []);
      badge.textContent = patients.length;

      if (patients.length === 0) {
        statusEl.textContent = '';
        contentEl.innerHTML = '<div class="empty">No patients found.</div>';
        return;
      }

      statusEl.textContent = `Last updated: ${new Date().toLocaleString()}`;

      const rows = patients.map(p => `
        <tr>
          <td>${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</td>
          <td>${escapeHtml(p.date_of_birth)}</td>
          <td>${escapeHtml(p.sex)}</td>
          <td>${formatPhone(p.phone_number)}</td>
          <td>${escapeHtml(p.address_line_1)}${p.address_line_2 ? ', ' + escapeHtml(p.address_line_2) : ''}</td>
          <td>${escapeHtml(p.city)}, ${escapeHtml(p.state)} ${escapeHtml(p.zip_code)}</td>
          <td>${escapeHtml(p.email)}</td>
          <td>${escapeHtml(p.insurance_provider)}</td>
          <td>${p.created_at ? new Date(p.created_at).toLocaleString() : '—'}</td>
        </tr>
      `).join('');

      contentEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>DOB</th>
              <th>Sex</th>
              <th>Phone</th>
              <th>Address</th>
              <th>City/State/Zip</th>
              <th>Email</th>
              <th>Insurance</th>
              <th>Registered</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    } catch (err) {
      statusEl.textContent = '';
      contentEl.innerHTML = `<div class="error">Failed to reach API: ${escapeHtml(err.message)}. Check the API base URL above and that the server is running.</div>`;
      badge.textContent = '0';
    }
  }

  // Auto-load on page open, and refresh every 15s
  loadPatients();
  setInterval(loadPatients, 15000);
</script>

</body>
</html>
